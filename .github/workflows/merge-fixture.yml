name: merge-fixture
on:
  workflow_dispatch:
    inputs:
      pr:
        required: true
permissions:
  contents: write
  pull-requests: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Merge as github-actions[bot]
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
        run: gh pr merge "$PR" --merge --repo "$GITHUB_REPOSITORY"